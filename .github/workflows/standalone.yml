name: Standalone

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-phox

      - name: configure
        run: cmake -Sstandalone -Bbuild -GNinja -DCMAKE_BUILD_TYPE=Debug

      - name: build
        run: cmake --build build -j4

      - name: run
        run: |
          mkdir -p out
          for scene in triangle cubes; do
            ./build/PhoxSample --scene "$scene" --time 1 --debug \
              --output "out/$scene.ppm" --dump-graph "out/$scene.dot"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: out/
