name: Ubuntu

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules
  # Rendering runs on lavapipe (set up below). The golden test must not skip for want of a device, and
  # runs with the validation layer, failing on any message, including synchronization hazards.
  PHOX_REQUIRE_GPU: 1
  PHOX_VALIDATION: 1

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-phox

      - name: configure
        run: cmake -Stest -Bbuild -GNinja -DENABLE_TEST_COVERAGE=1 -DCMAKE_BUILD_TYPE=Debug

      - name: build
        run: cmake --build build -j4

      - name: test
        run: |
          cd build
          ctest --build-config Debug

      - name: upload images that did not match their golden
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-mismatches
          path: build/golden_out/
          if-no-files-found: ignore

      - name: collect code coverage
        run: bash <(curl -s https://codecov.io/bash) || echo "Codecov did not collect coverage reports"
